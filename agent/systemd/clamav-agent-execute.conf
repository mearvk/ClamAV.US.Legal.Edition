# Max Rupplin - MEARVK LLC - 2026.
#
# Drop-in that lets the agent LEAVE dry-run and actually restore services.
#
# Install as:
#   /etc/systemd/system/clamav-agent.service.d/execute.conf
# then:
#   systemctl daemon-reload
#
# This is an explicit operator opt-in (operational rule O5). Even with
# --execute, the agent will only START/RESTART/RELOAD/ENABLE the ClamAV
# services; it never STOPs or DISABLEs clamd, and it never touches a scan
# verdict. Stopping/disabling other units would additionally require
# --allow-stop / --allow-disable, which are deliberately NOT set here.

[Service]
ExecStart=
ExecStart=/usr/bin/clamav-agent supervise --execute
